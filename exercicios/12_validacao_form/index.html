<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/scripts.js" defer></script>
    <script src="./assets/js/validateCPF.js" defer></script>
    <title>Formulário de Cadastro</title>
  </head>
  <body>
    <section class="container">
      <h1>Formulário de Cadastro</h1>
      <ul>
        <li>Nenhum campo pode estar vazio</li>
        <li>Usuário só poderá conter letras e/ou números</li>
        <li>Usuário usuário deverá ter entre 3 e 12 caracteres</li>
        <li>Senha precisa ter entre 6 e 12 caracteres</li>
      </ul>

      <form action="/" method="POST" class="form">
        <label for="name">Nome</label>
        <input type="text" name="name" class="name valid" />
        <label for="sobrenome">Sobrenome</label>
        <input type="text" name="sobrenome" class="sobrenome valid" />
        <label for="nome">CPF</label>
        <input type="text" name="cpf" class="cpf valid" />
        <label for="user">Usuário</label>
        <input type="text" name="user" class="user valid" />
        <label for="password">Senha</label>
        <input type="password" name="password" class="password valid" />
        <label for="retry-password">Repetir Senha</label>
        <input
          type="password"
          name="retry-password"
          class="retry-password valid"
        />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>
</html>
