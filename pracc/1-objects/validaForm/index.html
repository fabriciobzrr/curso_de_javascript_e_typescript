<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css" />
    <script src="cpfvalidator.js" defer></script>
    <script src="main.js" defer></script>
  </head>

  <body>
    <section class="container">
      <h1>Formulário de cadastro</h1>
      <ul>
        <li>Nenhum campo pode estar vazio</li>
        <li>Usuário só poderá conter letras e/ou números</li>
        <li>Usuário deverá ter entre 4 e 16 caracteres</li>
        <li>Senha precisa ter entre 8 e 32 caracteres</li>
      </ul>

      <form action="/" method="POST" class="formulario">
        <label>Nome</label>
        <input type="text" class="name validate" />
        <label>Sobrenome</label>
        <input type="text" class="lastname validate" />
        <label>CPF</label>
        <input type="text" class="cpf validate" />
        <label>Usuário</label>
        <input type="text" class="user validate" />
        <label>Senha</label>
        <input type="password" class="password validate" />
        <label>Repetir Senha</label>
        <input type="password" class="retry-password validate" />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>
</html>
